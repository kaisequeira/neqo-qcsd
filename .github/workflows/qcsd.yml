name: QCSD
on:
  push:
    branches:
      - qcsd-migration
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qcsd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: mozilla/actions/rust@c7f9db3409fff64a55f16ac0cacbc4cdd05ae435 # v1.1.19
        with:
          version: stable
          components: clippy
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: nss-version
        uses: ./.github/actions/minimum-version
        with:
          directory: .
      - uses: mozilla/actions/nss@c7f9db3409fff64a55f16ac0cacbc4cdd05ae435 # v1.1.19
        with:
          minimum-version: ${{ steps.nss-version.outputs.minimum }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Default Neqo builds
        run: |
          cargo check --locked -p neqo-transport
          cargo check --locked -p neqo-http3
          cargo check --locked -p neqo-bin
      - name: QCSD core and adapters
        run: |
          cargo test --locked -p neqo-qcsd
          cargo clippy --locked -p neqo-qcsd --all-targets -- -D warnings
          cargo doc --locked -p neqo-qcsd --no-deps
          cargo check --locked -p neqo-transport --features qcsd
          cargo clippy --locked -p neqo-transport --features qcsd --lib -- -D warnings
          cargo test --locked -p neqo-transport --features qcsd --lib
          cargo check --locked -p neqo-http3 --features qcsd
          cargo clippy --locked -p neqo-http3 --features qcsd --lib -- -D warnings
          cargo test --locked -p neqo-http3 --features qcsd --lib
          cargo clippy --locked -p neqo-bin --features qcsd --bin neqo-qcsd-client -- -D warnings
          cargo build --locked -p neqo-bin --features qcsd --bin neqo-qcsd-client
